services:
  - type: web
    name: resume-ai-backend
    runtime: node
    buildCommand: npm install && npm install --prefix resume-ai && npm run build --prefix resume-ai
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: AI_PROVIDER
        value: groq
    rootDir: ./
